<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Paper - Backlog Buddy</title>
<meta name="description" content="Read and download an engineering previous year question paper in the Backlog Buddy viewer.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container" id="page">
  <div class="page-head">
    <div class="crumbs" id="crumbs"></div>
    <div id="paper-head"></div>
  </div>

  <div class="viewer-layout" id="viewer">
    <div>
      <div class="row row-wrap no-print" style="margin-bottom:14px">
        <button class="btn btn-outline btn-sm" id="print-btn">Print</button>
        <button class="btn btn-primary btn-sm" id="dl-btn">Download PDF</button>
        <button class="btn btn-soft btn-sm" id="save-btn">Save paper</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="fs-btn">Toggle PDF embed</button>
      </div>
      <div id="pdf-embed" class="hidden" style="margin-bottom:16px"></div>
      <article class="paper-sheet" id="sheet"></article>
      <div class="callout mt-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <div><b>Reconstructed paper</b><p>The text view above is rebuilt from the questions recorded for this subject and year on Backlog Buddy. Download the PDF for the same content in exam format.</p></div>
      </div>
    </div>

    <aside class="stack">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Paper details</div>
        <div id="paper-meta"></div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Other papers for this subject</div>
        <div class="mini-list" id="related"></div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Study material</div>
        <div class="mini-list" id="mat-links"></div>
        <a class="btn btn-soft btn-sm btn-block mt-2" id="subject-link">Open subject page</a>
      </div>
    </aside>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
<div id="toasts"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pdf.js"></script>
<script src="assets/js/pages/paper.js"></script>
</body>
</html>
