<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previous Question Papers - Backlog Buddy</title>
<meta name="description" content="Search and download previous year engineering question papers by branch, semester, subject, subject code, academic year, exam type and regulation.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <div class="page-head">
    <div class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><span>Question Papers</span></div>
    <span class="eyebrow">Question paper library</span>
    <h1 class="mt-2">Previous year question papers</h1>
    <p class="lead">Filter the library by branch, semester, subject, subject code, academic year, exam type or regulation. Every paper can be read in the built-in viewer or downloaded as a PDF.</p>
  </div>

  <section class="section-sm">
    <div class="filter-bar">
      <label class="field fld-full"><span>Search papers</span>
        <input type="search" id="q" placeholder="Search by subject, code, year or exam type..."></label>
      <label class="field"><span>Branch</span><select id="f-branch"><option value="">All branches</option></select></label>
      <label class="field"><span>Semester</span><select id="f-sem"><option value="">All semesters</option></select></label>
      <label class="field"><span>Subject</span><select id="f-subject"><option value="">All subjects</option></select></label>
      <label class="field"><span>Subject code</span><input type="text" id="f-code" placeholder="e.g. 21CS32"></label>
      <label class="field"><span>Academic year</span><select id="f-year"><option value="">All years</option></select></label>
      <label class="field"><span>Exam type</span><select id="f-type"><option value="">All exam types</option></select></label>
      <label class="field"><span>Regulation</span><select id="f-reg"><option value="">All regulations</option></select></label>
      <div class="field"><span>&nbsp;</span>
        <label class="checkbox"><input type="checkbox" id="f-saved"><span>Only saved papers</span></label></div>
    </div>
    <div class="filter-summary">
      <span class="badge badge-blue" id="count-badge">0 papers</span>
      <span class="badge badge-gray" id="mode-badge">Demo data</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" id="reset">Reset filters</button>
      <button class="btn btn-outline btn-sm" id="sort-btn">Sort: Newest first</button>
    </div>
  </section>

  <section class="section-sm">
    <div class="grid grid-3" id="paper-grid"></div>
    <div class="center mt-4 hidden" id="load-more-wrap">
      <button class="btn btn-outline" id="load-more">Load more papers</button>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
<div id="toasts"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/pdf.js"></script>
<script src="assets/js/pages/papers.js"></script>
</body>
</html>
