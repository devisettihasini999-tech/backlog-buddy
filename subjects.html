<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Subjects - Backlog Buddy</title>
<meta name="description" content="Browse engineering subjects branch-wise and semester-wise on Backlog Buddy and open a subject to see previous papers, important questions and study material.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <div class="page-head">
    <div class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><span>Subjects</span></div>
    <span class="eyebrow">Branch &amp; semester selection</span>
    <h1 class="mt-2">Find your subject</h1>
    <p class="lead">Select your branch and semester to see the subjects you have a backlog in. Every subject page contains previous papers, important questions, unit-wise topics, model papers and study material.</p>
  </div>

  <section class="section-sm">
    <div class="card" style="padding:20px">
      <div class="field-label">Branch</div>
      <div class="tag-cloud" id="branch-chips"></div>
      <div class="field-label mt-3">Semester</div>
      <div class="tag-cloud" id="sem-chips"></div>
      <div class="divider"></div>
      <div class="filter-bar" style="border:none;box-shadow:none;padding:0;background:transparent">
        <label class="field"><span>Search subject or code</span>
          <input type="search" id="q" placeholder="e.g. data structures or 21CS32"></label>
        <label class="field"><span>Sort by</span>
          <select id="sort">
            <option value="code">Subject code</option>
            <option value="name">Subject name</option>
            <option value="papers">Most papers</option>
            <option value="questions">Most questions</option>
          </select></label>
        <label class="field"><span>Regulation</span>
          <select id="reg"><option value="">All regulations</option></select></label>
        <div class="field"><span>&nbsp;</span>
          <label class="checkbox"><input type="checkbox" id="with-papers"><span>Only subjects with papers</span></label></div>
      </div>
      <div class="filter-summary">
        <span class="badge badge-blue" id="count-badge">0 subjects</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="reset">Reset filters</button>
      </div>
    </div>
  </section>

  <section class="section-sm">
    <div class="grid grid-3" id="subject-grid"></div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
<div id="toasts"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/subjects.js"></script>
</body>
</html>
